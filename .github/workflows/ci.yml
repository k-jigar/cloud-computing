name: CI-CD Pipeline

on:
  push:
    branches: [ "main", "master" ]
    tags: [ "v*", "final" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:
    inputs:
      test_bad_model:
        description: 'Set to true to evaluate untrained bad model for Quality Gate failure demo'
        required: false
        default: 'false'

jobs:
  lint:
    name: Code Linting
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Linting Tools
        run: |
          python -m pip install --upgrade pip
          pip install flake8

      - name: Run Flake8 Linter
        run: |
          # Stop build on syntax errors or undefined names
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
          # Warning check for complexity
          flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

  unit-tests:
    name: Unit Tests
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Test Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r service/requirements.txt
          pip install pytest pyyaml

      - name: Run Unit Tests (at least 3 tests)
        run: |
          pytest -v tests/

  secret-scan:
    name: Secret Scanning
    needs: unit-tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks Secret Scanner
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  model-eval-and-quality-gate:
    name: Model Evaluation and Quality Gate
    needs: secret-scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Runtime Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r service/requirements.txt

      - name: Download Model Artifacts from GitHub Release
        id: download_release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p models/v1
          # Attempt to download release assets if release exists, or use local weights
          if gh release download v1.0.0 --dir models/v1 2>/dev/null; then
            echo "Downloaded model assets from GitHub Release v1.0.0"
          else
            echo "Release download skipped or fallback to direct download/local."
          fi

      - name: Run Model Inference on Validation Data
        run: |
          if [ "${{ github.event.inputs.test_bad_model }}" = "true" ]; then
            echo "Running deliberately untrained bad model to test quality gate failure..."
            python tools/eval_untrained.py
            cp results/untrained_predictions.jsonl results/predictions.jsonl
          else
            python tools/eval_student.py --model-dir models/v1 --out results/predictions.jsonl
          fi

      - name: Quality Gate (score.py --min-validity 95)
        run: |
          python tools/score.py results/predictions.jsonl data/validation.jsonl --min-validity 95 --out results/ci_score.json

