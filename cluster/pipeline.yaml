apiVersion: v1
kind: Namespace
metadata:
  name: pipeline
---
apiVersion: batch/v1
kind: Job
metadata:
  name: worker-shard-0
  namespace: pipeline
spec:
  template:
    metadata:
      labels:
        app: labelling-worker
        shard: "0"
    spec:
      restartPolicy: OnFailure
      containers:
        - name: worker
          image: python:3.11-slim
          command: ["python", "-u", "/app/worker/worker.py"]
          env:
            - name: SHARD_INDEX
              value: "0"
            - name: SHARD_COUNT
              value: "2"
            - name: INPUT_FILE
              value: "/data/commands_pool.jsonl"
            - name: OUTPUT_DIR
              value: "/datasets/teacher"
            - name: OLLAMA_HOST
              value: "http://host.k3d.internal:11434"
            - name: PROMPT_FILE
              value: "/app/prompts/teacher_prompt.txt"
          volumeMounts:
            - name: app-code
              mountPath: /app
            - name: data-volume
              mountPath: /data
            - name: datasets-volume
              mountPath: /datasets
      volumes:
        - name: app-code
          hostPath:
            path: /var/lib/k3s/app
        - name: data-volume
          hostPath:
            path: /var/lib/k3s/data
        - name: datasets-volume
          hostPath:
            path: /var/lib/k3s/datasets
---
apiVersion: batch/v1
kind: Job
metadata:
  name: worker-shard-1
  namespace: pipeline
spec:
  template:
    metadata:
      labels:
        app: labelling-worker
        shard: "1"
    spec:
      restartPolicy: OnFailure
      containers:
        - name: worker
          image: python:3.11-slim
          command: ["python", "-u", "/app/worker/worker.py"]
          env:
            - name: SHARD_INDEX
              value: "1"
            - name: SHARD_COUNT
              value: "2"
            - name: INPUT_FILE
              value: "/data/commands_pool.jsonl"
            - name: OUTPUT_DIR
              value: "/datasets/teacher"
            - name: OLLAMA_HOST
              value: "http://host.k3d.internal:11434"
            - name: PROMPT_FILE
              value: "/app/prompts/teacher_prompt.txt"
          volumeMounts:
            - name: app-code
              mountPath: /app
            - name: data-volume
              mountPath: /data
            - name: datasets-volume
              mountPath: /datasets
      volumes:
        - name: app-code
          hostPath:
            path: /var/lib/k3s/app
        - name: data-volume
          hostPath:
            path: /var/lib/k3s/data
        - name: datasets-volume
          hostPath:
            path: /var/lib/k3s/datasets

